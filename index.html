  const BADGES = [
    { id: 'first', label: 'First moto', desc: 'Finish your first moto', test: (p) => p.runsDone >= 1 },
    { id: 'perfect', label: 'Clean run', desc: 'Get every question right', test: (p, x) => x && x.pct === 100 },
    { id: 'turbo', label: 'Full gas', desc: '6 right in a row', test: (p, x) => x && x.bestCombo >= 6 },
    { id: 'streak3', label: '3-day streak', desc: 'Ride 3 days in a row', test: (p) => p.best >= 3 },
    { id: 'streak7', label: '7-day streak', desc: 'Ride 7 days in a row', test: (p) => p.best >= 7 },
    { id: 'halfway', label: 'Halfway', desc: 'Clear half the sections', test: (p, x, sub) => clearedCount(p, sub) >= racing(sub).length / 2 },
    { id: 'joburg', label: 'Main event', desc: 'Score 80% on the main event', test: (p) => (p.examBest || 0) >= 80 },
    { id: 'k1', label: '1 000 points', desc: 'Earn 1 000 points', test: (p) => p.earned >= 1000 },
  ];
  const PRAISE = ['Send it!', 'Full gas!', 'Clean line!', 'Pinned!', 'Lekker!', 'Whip it!', 'Sharp!', 'Braaap!', 'Yebo!'];

  // ---------- saved progress ----------
  const blankPlayer = (pack) => ({
    points: 0, earned: 0, streak: 0, best: 0, lastDay: null, runsDone: 0, totalQ: 0, totalOk: 0,
    days: {}, skills: {}, topics: {}, runs: [], missed: [], badges: [],
    paint: pack.defaultPaint, bike: 'mini', plate: pack.plate, ownedP: [pack.defaultPaint], ownedB: ['mini'], dailyBy: {}, examBy: {},
  });
  function load() {
    let s = null;
    try {
      s = JSON.parse(localStorage.getItem(KEY));
    } catch (e) { /* storage blocked: play on without saving */ }
    s = s || { players: {}, sound: true, autoRead: false };
    for (const id of Object.keys(RS.packs)) s.players[id] = Object.assign(blankPlayer(RS.packs[id]), s.players[id]);
    return s;
  }
  const state = load();
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* storage blocked */ }
  }

  const ui = { who: null, subject: null, tab: 'home', run: null, result: null, confirmReset: false, chartPick: null, voiceBlocked: false };
  const P = () => state.players[ui.who];
  const PK = () => RS.packs[ui.who];
  const SUB = () => PK().subjects[ui.subject];
  const racing = (sub) => sub.topics.filter((t) => !t.warmup);

  // ---------- dates and sums ----------
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const daysAgo = (n) => {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  };
  const liveStreak = (p) => (p.lastDay === dayKey() || p.lastDay === dayKey(daysAgo(1)) ? p.streak : 0);
  const dayLog = (p) => p.days[dayKey()] || (p.days[dayKey()] = { pts: 0, q: 0, ok: 0 });
  const mastery = (p, t) => t.skills.reduce((a, id) => a + ((p.skills[id] && p.skills[id].m) || 0), 0) / t.skills.length;
  const seenTopic = (p, t) => t.skills.some((id) => p.skills[id] && p.skills[id].seen);
  const isCleared = (p, t) => ((p.topics[t.id] && p.topics[t.id].stars) || 0) >= 2 || mastery(p, t) >= 0.6;
  const clearedCount = (p, sub) => racing(sub).filter((t) => isCleared(p, t)).length;
  const nextStop = (p, sub) => racing(sub).find((t) => !isCleared(p, t));
  const topicOf = (skill) => SUB().topics.find((t) => t.skills.includes(skill));

  // ---------- the exam timetable ----------
  const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const parseDay = (s) => {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  };
  const daysUntil = (s) => Math.round((parseDay(s) - parseDay(dayKey())) / 86400000);
  const shortDay = (s) => {
    const d = parseDay(s);
    return `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  };
  const whenText = (n) => (n < 0 ? 'Done' : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : `In ${n} days`);
  const nextExam = (pack) => (pack.exams || []).find((e) => daysUntil(e.date) >= 0 && pack.subjects[e.subject]);
  const openSubject = (pack) => (nextExam(pack) || { subject: Object.keys(pack.subjects)[0] }).subject;

  // ---------- icons and pictures ----------
  const ICONS = {
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
    route: '<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
    wrench: '<path d="M14.700 6.300a4 4 0 0 0-5.400 5.400L3 18l3 3 6.300-6.300a4 4 0 0 0 5.400-5.400l-2.600 2.600-2.400-.6-.6-2.400z"/>',
    chart: '<path d="M3 21h18"/><path d="M6 17v-6"/><path d="M12 17V5"/><path d="M18 17v-9"/>',
    flame: '<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-3.500 2-4.500.5 2 1.500 3 2.500 3 0-3-.5-6 1.500-9.500z"/>',
    star: '<path d="m12 3 2.700 5.800 6.300.8-4.600 4.300 1.200 6.300L12 17.100l-5.600 3.100 1.200-6.300L3 9.600l6.300-.8z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
    speaker: '<path d="M4 9.500v5h3.500L12 19V5L7.500 9.500z"/><path d="M15.500 9a4 4 0 0 1 0 6"/><path d="M18 6.500a8 8 0 0 1 0 11"/>',
    x: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
    arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
    swap: '<path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/>',
    back: '<path d="M9 5H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-7-7z"/><path d="m12 9.500 5 5"/><path d="m17 9.500-5 5"/>',
    check: '<path d="m4 12.500 5 5L20 6.500"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    spark: '<path d="M12 3l2.200 6.800L21 12l-6.800 2.200L12 21l-2.200-6.800L3 12l6.800-2.200z"/>',
    next: '<path d="m9 6 6 6-6 6"/>',
  };
  const ic = (name, size = 22, fill) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

  const bike = (id, paintKey, label) => {
    const p = PAINTS[paintKey] || PAINTS.orange;
    const alt = label === undefined ? `${BIKES[id].label} bike in ${p.label}` : label;
    return `<img class="bike" src="img/bike-${id}.webp" alt="${alt}" style="filter:${p.filter}" decoding="async">`;
  };
  const photo = (name, alt = '') => `<img class="photo" src="img/${name}.webp" alt="${alt}" decoding="async">`;
  const plate = (num) => `<span class="plate" aria-label="Race number ${h(String(num))}">${h(String(num))}</span>`;

  function applyAccent() {
    const root = document.documentElement;
    const p = ui.who ? PAINTS[P().paint] : PAINTS.orange;
    root.style.setProperty('--accent', p.hex);
    root.style.setProperty('--accent-dark', p.dark);
    root.style.setProperty('--accent-ink', p.ink);
  }

  const stars = (n, size = 16) => `<span class="stars" role="img" aria-label="${n} of 3 stars">${[1, 2, 3].map((i) => `<span class="${i <= n ? 'on' : ''}">${ic('star', size, true)}</span>`).join('')}</span>`;

  // ---------- who's riding ----------
  function viewPick() {
    const cards = Object.values(RS.packs).map((pack) => {
      const p = state.players[pack.id];
      return `<button class="pick-card" data-act="who" data-id="${pack.id}">
        <div class="stage">${bike(p.bike, p.paint, `${pack.name}'s ${BIKES[p.bike].label} bike`)}</div>
        <div class="pick-name">${plate(p.plate)}<h2>${pack.name}</h2></div>
        <div class="pick-stats">
          <span class="chip">${pack.grade}</span>
          <span class="chip lime num">${RS.fmt(p.points)} points</span>
          <span class="chip ${liveStreak(p) ? 'good' : ''} num">${liveStreak(p)} day streak</span>
        </div>
      </button>`;
    });
    return `<main class="pick">
      <div class="pick-hero">${photo('hero-jump', 'A rider whipping a dirt bike over a jump')}<div class="brand">Holeshot</div></div>
      <p class="muted" style="font-size:17px;padding-inline:4px">First to the first corner, one right answer at a time. Who's riding?</p>
      <div class="pick-grid">${cards.join('')}</div>
    </main>`;
  }

  // ---------- shell ----------
  const TABS = [['home', 'home', 'Home'], ['route', 'route', 'Track'], ['garage', 'wrench', 'Pits'], ['progress', 'chart', 'Progress']];
  function shell(inner) {
    const p = P();
    const pack = PK();
    return `<div class="wrap">
      <header class="top">
        ${plate(p.plate)}
        <div class="top-who"><h1>Hello, ${pack.name}</h1><div class="small-t muted">${pack.grade} · ${pack.term}</div></div>
        <button class="round" data-act="switch" aria-label="Switch rider">${ic('swap')}</button>
      </header>
      ${inner}
    </div>
    <nav class="nav" aria-label="Main">
      ${TABS.map(([id, icon, label]) => `<button class="navb ${ui.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}" aria-label="${label}" ${ui.tab === id ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></button>`).join('')}
    </nav>`;
  }

  // ---------- home ----------
  function subjectStrip(pack) {
    const chip = (id, label, sub, cls, locked) => `<button class="sub-chip ${cls}" ${locked ? 'disabled' : `data-act="subject" data-id="${id}"`}>${locked ? ic('lock', 13) : ''}<b>${label}</b><small class="num">${sub}</small></button>`;
    if (pack.exams) {
      return pack.exams.map((e) => {
        const n = daysUntil(e.date);
        const has = !!pack.subjects[e.subject];
        const cls = `${e.subject === ui.subject ? 'on' : ''} ${n < 0 ? 'past' : ''}`;
        return chip(e.subject, e.label, has ? shortDay(e.date) : 'Coming soon', cls, !has);
      }).join('');
    }
    return Object.entries(pack.subjects).map(([id, s]) => chip(id, s.label, 'Open', id === ui.subject ? 'on' : '', false)).join('') + (pack.locked || []).map((l) => chip('', l, 'Needs its books', '', true)).join('');
  }
  function examCard(pack) {
    const e = nextExam(pack);
    const list = `<div class="sub-strip" role="group" aria-label="Choose a subject">${subjectStrip(pack)}</div>`;
    if (!e) return `<section class="card" aria-label="Subjects"><div class="eyebrow" style="margin-bottom:8px">Subjects</div>${list}</section>`;
    const n = daysUntil(e.date);
    return `<section class="card next-exam ${n <= 1 ? 'soon' : ''}" aria-label="Next exam">
      <div class="next-head">
        <div style="min-width:0"><div class="eyebrow">Next exam</div><div class="next-name">${e.label}</div><div class="small-t muted num">${shortDay(e.date)}</div></div>
        <div class="next-when">${whenText(n)}</div>
      </div>
      ${list}
    </section>`;
  }
  function viewHome() {
    const p = P();
    const pack = PK();
    const sub = SUB();
    const main = racing(sub);
    const today = p.days[dayKey()] || { pts: 0 };
    const acc = p.totalQ ? Math.round((100 * p.totalOk) / p.totalQ) : null;
    const cleared = clearedCount(p, sub);
    const next = nextStop(p, sub);
    const pct = cleared / main.length;
    const doneToday = p.dailyBy[ui.subject] === dayKey();
    const best = p.examBy[ui.subject];
    const weak = main.filter((t) => seenTopic(p, t)).map((t) => ({ t, m: mastery(p, t) })).sort((a, b) => a.m - b.m).filter((x) => x.m < 0.85).slice(0, 3);
    const coach = weak.length
      ? weak.map((x, i) => `<div class="coach-item"><div class="coach-row"><span class="rank">${i + 1}</span><h3>${x.t.title}</h3><button class="btn dark small" data-act="start" data-mode="topic" data-topic="${x.t.id}">Practise</button></div><div class="meter" role="img" aria-label="${Math.round(x.m * 100)} percent"><i style="width:${Math.round(x.m * 100)}%"></i></div></div>`).join('')
      : `<div class="coach-item"><p class="small-t">${seenTopic(p, main[0]) ? 'Nothing needs fixing right now. Try the main event.' : 'Finish one moto and your coach will find what to practise next.'}</p></div>`;
    return shell(`
      ${examCard(pack)}
      <div class="home-grid">
        <section class="hero" aria-label="Today's moto">
          <div class="hero-photo">${photo('hero-jump', 'A rider whipping a dirt bike over a jump')}<span class="chip on-photo ${doneToday ? '' : 'lime'}">${doneToday ? 'Done today' : 'Ready'}</span></div>
          <div class="hero-pad">
            <div><div class="eyebrow">${sub.label} · ${sub.scope}</div><h2>Today's moto</h2></div>
            <div class="trio">
              <div><b class="num">10</b><small>questions</small></div>
              <div><b class="num">6</b><small>minutes or so</small></div>
              <div><b class="num">100+</b><small>points to win</small></div>
            </div>
            <div class="strip">
              <div><b>Start</b><small class="num">${cleared} cleared</small></div>
              ${roadBar(pct, false)}
              <div style="text-align:right"><b>Finish</b><small class="num">${main.length} sections</small></div>
            </div>
            <button class="btn primary full" data-act="start" data-mode="daily">${doneToday ? 'Go again' : 'Drop the gate'} ${ic('arrow')}</button>
          </div>
        </section>
        <div class="home-side">
          <section class="tiles" aria-label="Your numbers">
            ${tile('star', 'Points', RS.fmt(p.points), today.pts ? `<span class="chip lime num">+${today.pts} today</span>` : '<span class="chip">Ride to earn</span>')}
            ${tile('flame', 'Day streak', liveStreak(p), `<span class="chip ${liveStreak(p) ? 'good' : ''} num">Best ${p.best}</span>`)}
            ${tile('target', 'Right first try', acc === null ? '–' : acc + '%', `<span class="chip num">${RS.fmt(p.totalQ)} questions</span>`)}
            ${tile('flag', 'Sections cleared', `${cleared}/${main.length}`, `<span class="chip">${next ? next.stop : 'All clear'}</span>`)}
          </section>
          <section class="coach" aria-label="Coach">
            <div class="coach-head"><span class="coach-dot">${ic('spark', 20, true)}</span><div><div class="h-sec">Fix these next</div><div class="small-t muted">${sub.label}: your coach picks from your answers</div></div></div>
            ${coach}
          </section>
          <section class="exam" aria-label="Main event">
            ${photo('main-event')}
            <div class="eyebrow" style="color:inherit;opacity:.75">${sub.label} practice test</div>
            <h2>Main event</h2>
            <p>${sub.examSize} mixed questions with no hints. ${best != null ? `Your best is ${best}%.` : 'Marks come at the end, like the real thing.'}</p>
            <button class="btn full" data-act="start" data-mode="exam">Line up</button>
          </section>
        </div>
      </div>`);
  }
  const tile = (icon, label, num, sub) => `<div class="tile"><span class="t-ic">${ic(icon, 20)}</span><div><div class="t-label">${label}</div><div class="t-num">${num}</div></div><div class="t-sub">${sub}</div></div>`;

  function roadBar(pct, run) {
    const p = Math.max(0, Math.min(1, pct));
    const me = P();
    return `<div class="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p * 100)}" aria-label="Progress on the track">
      <div class="road-track"></div>
      <div class="road-fill" style="width:${(p * 100).toFixed(1)}%"></div>
      <div class="road-bike" ${run ? 'id="road-bike"' : ''} style="left:calc((100% - 46px) * ${p.toFixed(3)})">${bike(me.bike, me.paint, '')}</div>
    </div>`;
  }

  const ruleCard = (t) => (t && t.notes ? `<details class="rules"><summary>${ic('spark', 14, true)} Rule card</summary><ul>${t.notes.map((n) => `<li>${h(n)}</li>`).join('')}</ul></details>` : '');

  // ---------- the track ----------
  function viewRoute() {
    const p = P();
    const pack = PK();
    const sub = SUB();
    const next = nextStop(p, sub);
    const best = p.examBy[ui.subject];
    const stops = sub.topics.map((t, i) => {
      const tp = p.topics[t.id] || {};
      const m = Math.round(mastery(p, t) * 100);
      const done = isCleared(p, t);
      const here = next && next.id === t.id;
      return `<article class="stop ${here ? 'here' : ''}">
        <div class="stop-photo">${photo(t.img, t.stop)}<span class="chip on-photo num">${t.warmup ? 'Extra practice' : done ? `${ic('check', 12)} Cleared` : here ? 'You are here' : `Section ${i + 1}`}</span></div>
        <div class="stop-body">
          <div class="stop-row">
            <div class="stop-txt"><span class="eyebrow">${t.stop}</span><h3>${t.title}</h3><div class="small-t muted">${t.blurb}</div></div>
            <button class="btn ${here ? 'primary' : ''} small" data-act="start" data-mode="topic" data-topic="${t.id}">Ride</button>
          </div>
          <div class="stop-row"><div class="meter" style="flex:1" role="img" aria-label="${m} percent"><i style="width:${m}%"></i></div><span class="small-t num muted">${m}%</span>${stars(tp.stars || 0, 14)}</div>
          ${ruleCard(t)}
        </div>
      </article>`;
    });
    const list = `<div class="sub-strip" role="group" aria-label="Choose a subject">${subjectStrip(pack)}</div>`;
    return shell(`
      <section class="card">
        <div class="eyebrow">${sub.source}</div>
        <div class="h-sec" style="font-size:24px">The ${sub.label} track</div>
        <p class="small-t muted" style="margin-bottom:10px">${sub.scope}. ${sub.note}. Ride the sections in any order. Clear one with 2 stars or more.</p>
        ${list}
      </section>
      <div class="stops">
        ${stops.join('')}
        <article class="stop final">
          <div class="stop-photo">${photo('main-event', 'Riders lined up at the start gate under floodlights')}<span class="chip on-photo">${ic('flag', 12)} Chequered flag</span></div>
          <div class="stop-body">
            <div class="stop-row">
              <div class="stop-txt"><span class="eyebrow">Practice test</span><h3>Main event</h3><div class="small-t" style="opacity:.75">${best != null ? `Best score ${best}%` : `${sub.examSize} questions from every section`}</div></div>
              <button class="btn small" data-act="start" data-mode="exam">Ride</button>
            </div>
          </div>
        </article>
      </div>`);
  }

  // ---------- the pits ----------
  function viewGarage() {
    const p = P();
    const bikes = Object.entries(BIKES).map(([id, r]) => {
      const own = p.ownedB.includes(id);
      const on = p.bike === id;
      const short = r.cost - p.points;
      return `<button class="ride ${on ? 'on' : ''}" data-act="bike" data-id="${id}" ${!own && short > 0 ? 'aria-disabled="true"' : ''}>
        <div class="stage">${bike(id, p.paint)}</div>
        <b>${r.label}</b>
        <span class="chip ${on ? 'good' : own ? '' : short > 0 ? '' : 'lime'} num">${on ? 'Riding' : own ? 'Yours' : short > 0 ? `${RS.fmt(r.cost)} points` : `Buy for ${RS.fmt(r.cost)}`}</span>
      </button>`;
    });
    const paints = Object.entries(PAINTS).map(([id, c]) => {
      const own = p.ownedP.includes(id);
      return `<button class="paint ${p.paint === id ? 'on' : ''}" data-act="paint" data-id="${id}" aria-label="${c.label}">
        <span class="swatch" style="--c:${c.hex};color:${c.ink}">${own ? (p.paint === id ? ic('check', 20) : '') : ic('lock', 16)}</span>
        <span>${c.label}${own ? '' : `<br><b class="num">${c.cost}</b>`}</span>
      </button>`;
    });
    const badges = BADGES.map((b) => `<div class="badge ${p.badges.includes(b.id) ? 'got' : ''}"><b>${b.label}</b><small>${b.desc}</small></div>`);
    return shell(`
      <section class="card" style="display:grid;gap:10px">
        <div class="hero-head"><div><div class="eyebrow">Your bike</div><div class="h-sec" style="font-size:24px">${BIKES[p.bike].label}</div></div><span class="chip lime num">${RS.fmt(p.points)} points</span></div>
        <div class="stage">${bike(p.bike, p.paint)}</div>
      </section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">Race number</div>
        <div class="plate-row"><input id="plate-input" class="plate-input" type="text" inputmode="numeric" maxlength="3" value="${h(String(p.plate))}" aria-label="Your race number" autocomplete="off"><p class="small-t muted" style="flex:1;min-width:150px">Pick your number. It goes on your plate at the top of every screen.</p></div>
      </section>
      <section class="card"><div class="h-sec" style="margin-bottom:4px">Graphics kit</div><p class="small-t muted" style="margin-bottom:10px">Your kit colours the bike and the whole app.</p><div class="paints">${paints.join('')}</div></section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">Bikes</div><div class="rides">${bikes.join('')}</div></section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">Badges</div><div class="badges">${badges.join('')}</div></section>`);
  }

  // ---------- progress ----------
  function dayChart(p) {
    const n = 14;
    const days = Array.from({ length: n }, (_, i) => {
      const d = daysAgo(n - 1 - i);
      return { key: dayKey(d), d, pts: (p.days[dayKey(d)] || {}).pts || 0 };
    });
    const peak = Math.max(...days.map((x) => x.pts), 0);
    const top = peak <= 100 ? 100 : Math.ceil(peak / 100) * 100;
    const W = 340;
    const H = 130;
    const L = 26;
    const B = 18;
    const plot = H - B - 6;
    const stepX = (W - L) / n;
    const y = (v) => 6 + plot - (v / top) * plot;
    const fmtDay = (d) => d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });
    const bars = days.map((x, i) => {
      const bx = L + i * stepX + stepX / 2 - 6;
      const bh = x.pts ? Math.max(5, (x.pts / top) * plot) : 0;
      const sel = ui.chartPick === x.key;
      const shape = bh ? `<path class="bar ${sel ? 'sel' : ''}" d="M${bx} ${6 + plot}v${-(bh - 4)}q0-4 4-4h4q4 0 4 4v${bh - 4}z"/>` : '';
      return `<g data-act="bar" data-id="${x.key}"><title>${fmtDay(x.d)}: ${x.pts} points</title><rect class="hit" x="${L + i * stepX}" y="0" width="${stepX}" height="${H}"/>${shape}</g>`;
    });
    const pickedDay = days.find((x) => x.key === ui.chartPick);
    const readout = pickedDay ? `${fmtDay(pickedDay.d)}: ${pickedDay.pts} points` : `Tap a bar to see that day. Today: ${days[n - 1].pts} points.`;
    return `<div class="small-t muted num" style="margin-bottom:6px">${readout}</div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Points per day for the last 14 days">
        <line class="grid" x1="${L}" x2="${W}" y1="${y(top)}" y2="${y(top)}"/><line class="grid" x1="${L}" x2="${W}" y1="${y(top / 2)}" y2="${y(top / 2)}"/><line class="grid" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>
        <text x="${L - 4}" y="${y(top) + 3}" text-anchor="end">${top}</text><text x="${L - 4}" y="${y(top / 2) + 3}" text-anchor="end">${top / 2}</text><text x="${L - 4}" y="${y(0) + 3}" text-anchor="end">0</text>
        ${bars.join('')}
        <text x="${L + 2}" y="${H - 4}">${fmtDay(days[0].d)}</text><text x="${W - 2}" y="${H - 4}" text-anchor="end">Today</text>
      </svg>`;
  }

  function viewProgress() {
    const p = P();
    const pack = PK();
    const sub = SUB();
    const rows = sub.topics.map((t) => ({ t, m: Math.round(mastery(p, t) * 100) })).map(({ t, m }) => `<div class="row"><div class="row-top"><b>${t.title}</b><span class="num muted">${m}%</span></div><div class="meter" role="img" aria-label="${m} percent"><i style="width:${m}%"></i></div></div>`);
    const runs = p.runs.slice(0, 8).map((r) => `<div class="log-item"><div class="row-top"><b>${r.label}</b><span class="num">${r.pct}%</span></div><div class="small-t muted num">${r.when} · ${r.right} of ${r.total} right · +${r.pts} points</div></div>`);
    const missed = p.missed.slice(0, 10).map((m) => `<div class="log-item"><div>${h(m.q)}</div><div class="small-t" style="margin-top:2px"><b>Answer:</b> ${h(m.correct)}${m.given ? ` <span class="muted">(answered ${h(String(m.given))})</span>` : ''}</div><details><summary>Show the working</summary><ol>${m.steps.map((s) => `<li>${h(s)}</li>`).join('')}</ol></details></div>`);
    const toggle = (key, label, sub) => `<button class="toggle" role="switch" aria-checked="${!!state[key]}" data-act="toggle" data-id="${key}"><span><b style="font-weight:600">${label}</b><br><span class="small-t muted">${sub}</span></span><span class="switch"></span></button>`;
    return shell(`
      <section class="card"><div class="h-sec">Points per day</div><div class="small-t muted" style="margin-bottom:8px">Last 14 days</div>${dayChart(p)}</section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">${sub.label}: how strong is each topic?</div><div class="rows">${rows.join('')}</div></section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">Recent motos</div><div class="log">${runs.join('') || '<p class="small-t muted">Your motos will show here after your first one.</p>'}</div></section>
      <section class="card"><div class="h-sec" style="margin-bottom:10px">Questions to look at again</div><div class="log">${missed.join('') || '<p class="small-t muted">Questions you miss will show here with the working.</p>'}</div></section>
      <section class="card">
        <div class="h-sec" style="margin-bottom:4px">Settings</div>
        ${toggle('sound', 'Sound effects', 'Dings and fanfares')}
        ${toggle('autoRead', 'Read questions aloud', 'Speaks each question when it appears')}
        <div style="margin-top:10px">${ui.confirmReset
          ? `<p class="small-t" style="margin-bottom:8px">This wipes ${pack.name}'s points, streak and bikes on this device. It cannot be undone.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark small" data-act="reset-yes">Yes, start over</button><button class="btn small" data-act="reset-no">Keep my progress</button></div>`
          : `<button class="btn small" data-act="reset">Start ${pack.name} over</button>`}</div>
      </section>
      <section class="card">
        <div class="h-sec" style="margin-bottom:4px">About the questions</div>
        <p class="small-t muted">${pack.id === 'jordy'
          ? 'Written for this app from the school’s test list and the Grade 6 curriculum, without the textbooks themselves, so check anything that disagrees with the book: the book wins. Nothing is copied from the books, and NumberSense has no link to this app.'
          : 'A starter set of general Grade 4 topics. These will change once Kash’s own books are loaded.'} Progress saves on this device only.</p>
      </section>`);
  }

  // ---------- the moto ----------
  function buildQueue(p, sub, mode, topicId, n) {
    if (mode === 'exam') {
      const out = [];
      const topics = RS.shuffle(racing(sub));
      for (let i = 0; out.length < n; i++) {
        const t = topics[i % topics.length];
        const left = t.skills.filter((s) => !out.includes(s));
        out.push(RS.pick(left.length ? left : t.skills));
      }
      return RS.shuffle(out);
    }
    const pool = mode === 'topic' ? sub.topics.find((t) => t.id === topicId).skills : [...new Set(racing(sub).flatMap((t) => t.skills))];
    const used = {};
    const out = [];
    while (out.length < n) {
      const weights = pool.map((id) => {
        const s = p.skills[id];
        const base = s ? 0.25 + (1 - s.m) : 1.3;
        // One-section banks may repeat the skill; the asked list stops the same question repeating.
        return base * 0.35 ** (used[id] || 0) * (pool.length > 1 && out[out.length - 1] === id ? 0 : 1);
      });
      let r = Math.random() * weights.reduce((a, b) => a + b, 0);
      let idx = 0;
      while (idx < pool.length - 1 && (r -= weights[idx]) > 0) idx++;
      out.push(pool[idx]);
      used[pool[idx]] = (used[pool[idx]] || 0) + 1;
    }
    return out;
  }
  const levelFor = (p, id, mode) => {
    if (mode === 'exam') return 2;
    const m = (p.skills[id] && p.skills[id].m) || 0;
    return m < 0.45 ? 1 : m < 0.8 ? 2 : 3;
  };

  function startRun(mode, topicId) {
    const sub = SUB();
    const n = mode === 'exam' ? sub.examSize : 10;
    ui.result = null;
    ui.run = { mode, topicId, queue: buildQueue(P(), sub, mode, topicId, n).map((skill) => ({ skill })), i: 0, total: n, q: null, typed: '', tries: 0, combo: 0, bestCombo: 0, pts: 0, score: 0, right: 0, log: [], extras: 0, asked: new Set(), sheet: null, heard: '', listening: false, started: Date.now() };
    audio();
    nextQuestion();
  }
  function nextQuestion() {
    const r = ui.run;
    stopVoice();
    stopSpeaking();
    if (r.i >= r.queue.length) return finishRun();
    const slot = r.queue[r.i];
    const fn = PK().skills[slot.skill];
    const lvl = levelFor(P(), slot.skill, r.mode);
    let q;
    let key;
    let guard = 0;
    do {
      q = fn(lvl);
      key = q.q + (q.options || []).join();
      guard++;
    } while (r.asked.has(key) && guard < 40);
    r.asked.add(key);
    q.skill = slot.skill;
    q.bonus = !!slot.bonus;
    r.q = q;
    r.typed = '';
    r.tries = 0;
    r.sheet = null;
    r.heard = '';
    drawRun();
    if (state.autoRead) readAloud();
    const w = $('#ans-word');
    if (w) w.focus();
  }

  function settle(q, ok, firstTry, given) {
    const r = ui.run;
    const p = P();
    const s = p.skills[q.skill] || (p.skills[q.skill] = { seen: 0, ok: 0, m: 0 });
    const credit = ok ? (firstTry ? 1 : 0.5) : 0;
    s.seen++;
    if (ok && firstTry) s.ok++;
    s.m = s.m * 0.65 + credit * 0.35;
    p.totalQ++;
    if (ok && firstTry) p.totalOk++;
    const d = dayLog(p);
    d.q++;
    if (ok && firstTry) d.ok++;
    if (!q.bonus) {
      r.score += credit;
      if (ok) r.right++;
    }
    r.log.push({ q: q.q, correct: q.correct, given, ok, firstTry, steps: q.steps });
    if (!ok) {
      p.missed.unshift({ q: q.q, correct: q.correct, given, steps: q.steps, when: dayKey() });
      p.missed = p.missed.slice(0, 30);
    }
    save();
  }
  function award(n) {
    const p = P();
    p.points += n;
    p.earned += n;
    dayLog(p).pts += n;
    ui.run.pts += n;
  }

  function submit(given, optionIndex) {
    const r = ui.run;
    const q = r.q;
    if (r.sheet) return;
    let res;
    if (q.kind === 'mc') {
      res = { ok: optionIndex === q.answer };
      given = q.options[optionIndex];
    } else {
      res = RS.check(q, given);
      if (res.empty) {
        const box = $('.ans') || $('#ans-word');
        if (box) {
          box.classList.remove('shake');
          void box.offsetWidth;
          box.classList.add('shake');
        }
        return;
      }
      if (res.near) return toast(res.msg);
    }
    if (r.mode === 'exam') {
      settle(q, res.ok, true, given);
      if (res.ok) {
        award(10);
        r.combo++;
        r.bestCombo = Math.max(r.bestCombo, r.combo);
      } else r.combo = 0;
      sfx('tap');
      r.i++;
      return nextQuestion();
    }
    if (res.ok) {
      const first = r.tries === 0;
      if (first) r.combo++;
      r.bestCombo = Math.max(r.bestCombo, r.combo);
      const mult = r.combo >= 6 ? 3 : r.combo >= 3 ? 2 : 1;
      // Right first time on the very first question: first into the first corner.
      const holeshot = first && r.i === 0;
      const pts = (q.bonus || !first ? 5 : 10 * mult) + (holeshot ? 10 : 0);
      award(pts);
      settle(q, true, first, given);
      r.sheet = { type: 'right', title: holeshot ? 'Holeshot!' : RS.pick(PRAISE), pts, mult: first ? mult : 1, spell: res.spell, holeshot };
      sfx(mult > 1 || holeshot ? 'combo' : 'right');
      if (navigator.vibrate) navigator.vibrate(18);
    } else if (r.tries === 0) {
      r.tries = 1;
      r.combo = 0;
      r.sheet = { type: 'retry' };
      sfx('wrong');
    } else {
      settle(q, false, false, given);
      r.sheet = { type: 'wrong' };
      r.combo = 0;
      if (r.extras < 3 && !q.bonus) {
        r.queue.push({ skill: q.skill, bonus: true });
        r.extras++;
      }
      sfx('wrong');
    }
    drawRun();
  }

  function finishRun() {
    const r = ui.run;
    const p = P();
    const sub = SUB();
    const pct = Math.round((100 * r.score) / r.total);
    const earnedStars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
    let bonus = 20;
    if (pct === 100) bonus += 50;
    if (r.mode === 'exam' && pct >= 80) bonus += 50;
    award(bonus);
    const today = dayKey();
    if (p.lastDay !== today) {
      p.streak = p.lastDay === dayKey(daysAgo(1)) ? p.streak + 1 : 1;
      p.lastDay = today;
    }
    p.best = Math.max(p.best, p.streak);
    p.runsDone++;
    let label = "Today's moto";
    if (r.mode === 'topic') {
      const t = sub.topics.find((x) => x.id === r.topicId);
      label = t.title;
      const tp = p.topics[t.id] || (p.topics[t.id] = {});
      tp.stars = Math.max(tp.stars || 0, earnedStars);
      tp.best = Math.max(tp.best || 0, pct);
    } else if (r.mode === 'exam') {
      label = 'Main event';
      p.examBest = Math.max(p.examBest || 0, pct);
      p.examBy[ui.subject] = Math.max(p.examBy[ui.subject] || 0, pct);
    } else {
      p.dailyBy[ui.subject] = today;
    }
    p.runs.unshift({ label: `${sub.label}: ${label}`, pct, right: r.right, total: r.total, pts: r.pts, when: today, mode: r.mode });
    p.runs = p.runs.slice(0, 30);
    const x = { label, pct, stars: earnedStars, pts: r.pts, bonus, bestCombo: r.bestCombo, right: r.right, total: r.total, mode: r.mode, topicId: r.topicId, missed: r.log.filter((l) => !l.ok), newBadges: [], streak: p.streak };
    for (const b of BADGES) {
      if (!p.badges.includes(b.id) && b.test(p, x, sub)) {
        p.badges.push(b.id);
        x.newBadges.push(b);
      }
    }
    save();
    ui.run = null;
    ui.result = x;
    render();
    window.scrollTo(0, 0);
    sfx('fanfare');
    if (earnedStars >= 2) confetti();
  }

  // ---------- drawing the moto ----------
  function prettyTyped(s) {
    const m = s.match(/^(\d+)(,\d*)?$/);
    if (!m) return s;
    return RS.fmt(+m[1]) + (m[2] || '');
  }
  function visual(q) {
    const v = q.visual;
    if (!v) return '';
    if (v.type === 'flow') {
      const arrow = ic('next', 16);
      return `<div class="flow">${v.items.map((it, i) => `<span class="${i === 0 || i === v.items.length - 1 ? 'end' : ''}">${h(it)}</span>`).join(arrow)}</div>`;
    }
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${v.head.map((x) => `<th scope="col">${h(String(x))}</th>`).join('')}</tr></thead><tbody>${v.rows.map((row) => `<tr>${row.map((x) => `<td>${h(String(x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  const voiceReady = () => !ui.voiceBlocked && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const micBtn = () => (voiceReady() ? `<button class="mic ${ui.run.listening ? 'on' : ''}" id="mic" data-act="mic" aria-label="Say your answer" aria-pressed="${ui.run.listening}">${ic('mic', 24)}</button>` : '');

  function dock(q) {
    const r = ui.run;
    const exam = r.mode === 'exam';
    const skip = exam ? `<button class="btn small" data-act="skip" style="justify-self:center">Skip this one</button>` : '';
    if (q.kind === 'mc') {
      const short = q.options.every((o) => RS.plain(o).length <= 12);
      return `<div class="opts ${short ? 'two' : ''}">${q.options.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}" id="opt-${i}"><span class="opt-l">${'ABCD'[i]}</span><span class="opt-t">${h(o)}</span></button>`).join('')}</div>
        ${voiceReady() ? `<div class="mic-pill"><button class="btn small ${r.listening ? 'primary' : ''}" id="mic" data-act="mic" aria-pressed="${r.listening}">${ic('mic', 18)} Say A, B, C, D or the answer</button></div>` : ''}
        <div class="heard-line" id="heard">${h(r.heard)}</div>${skip}`;
    }
    if (q.kind === 'word') {
      return `<div class="ans-row"><input id="ans-word" class="ans-input" type="text" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer">${micBtn()}</div>
        <div class="heard-line" id="heard">${h(r.heard)}</div>
        <button class="btn primary full" data-act="check">Check</button>${skip}`;
    }
    const fraction = q.kind === 'fraction';
    const key = (k, label, cls = '') => `<button class="key ${cls}" data-act="key" data-k="${k}" aria-label="${label === k ? k : label}">${k === 'del' ? ic('back', 24) : label}</button>`;
    const digit = (d) => key(String(d), String(d));
    return `<div class="ans-row">
        <div class="ans" id="ans" role="textbox" aria-label="Your answer" aria-readonly="true">
          ${q.prefix ? `<span class="ans-fix">${q.prefix}</span>` : ''}
          <span id="ans-val">${h(prettyTyped(r.typed))}</span><span class="caret"></span>
          ${q.suffix ? `<span class="ans-fix" style="margin-left:auto">${h(q.suffix)}</span>` : ''}
        </div>
        ${micBtn()}
      </div>
      <div class="heard-line" id="heard">${h(r.heard)}</div>
      <div class="keys">
        ${digit(1)}${digit(2)}${digit(3)}${key('del', 'Delete', 'alt')}
        ${digit(4)}${digit(5)}${digit(6)}${fraction ? key(' ', 'Space', 'alt') : key(',', ',', 'alt')}
        ${digit(7)}${digit(8)}${digit(9)}${fraction ? key('/', '/', 'alt') : key('000', '000', 'alt')}
        ${key('0', '0', 'zero')}<button class="key check" data-act="check">${exam ? 'Next' : 'Check'}</button>
      </div>${skip}`;
  }

  function sheetHTML() {
    const r = ui.run;
    const s = r.sheet;
    const q = r.q;
    if (!s) return '';
    const steps = `<ol class="steps">${q.steps.map((x) => `<li>${h(x)}</li>`).join('')}</ol>`;
    if (s.type === 'quit') {
      return `<div class="sheet" role="dialog" aria-label="Pull off the track?"><div class="sheet-head"><h2>Pull off the track?</h2></div><p class="muted">You keep the ${r.pts} points from this moto, but it won't count towards your streak.</p><button class="btn primary full" data-act="unquit" data-primary>Keep riding</button><button class="btn full" data-act="quit-yes">Pull off</button></div>`;
    }
    if (s.type === 'right') {
      return `<div class="sheet good" role="status"><div class="sheet-head"><h2>${s.title}</h2><span class="pts num">+${s.pts}</span></div>
        ${s.holeshot ? '<p class="small-t">First into the first corner: +10 bonus.</p>' : ''}
        ${s.mult > 1 ? `<p><span class="combo pop">${ic('bolt', 12, true)} ×${s.mult} full gas</span> ${r.combo} in a row</p>` : ''}
        ${s.spell ? `<p class="small-t">It's spelt <b>${h(s.spell)}</b>.</p>` : ''}
        <details><summary>Show the working</summary>${steps}</details>
        <button class="btn primary full" data-act="next" data-primary>Next ${ic('arrow')}</button></div>`;
    }
    if (s.type === 'retry') {
      return `<div class="sheet warn" role="status"><div class="sheet-head"><h2>Stalled it</h2></div><p style="font-size:17px">${h(q.hint)}</p>${ruleCard(topicOf(q.skill))}<button class="btn primary full" data-act="retry" data-primary>Kick it over</button></div>`;
    }
    return `<div class="sheet bad" role="status"><div class="sheet-head"><h2>Here's the line</h2></div><p style="font-size:17px">The answer is <b>${h(q.correct)}</b>.</p>${steps}${ruleCard(topicOf(q.skill))}${q.bonus ? '' : '<p class="small-t muted">You\'ll get another one like this at the end.</p>'}<button class="btn primary full" data-act="next" data-primary>Got it ${ic('arrow')}</button></div>`;
  }

  function viewRun() {
    const r = ui.run;
    const q = r.q;
    const t = topicOf(q.skill);
    const pct = (r.i + (r.sheet && r.sheet.type !== 'retry' && r.sheet.type !== 'quit' ? 1 : 0)) / r.queue.length;
    const mult = r.combo >= 6 ? 3 : r.combo >= 3 ? 2 : 1;
    return `<section class="run" aria-label="Question ${r.i + 1} of ${r.queue.length}">
      <header class="run-top">
        <button class="round" data-act="quit" aria-label="Pull off the track">${ic('x')}</button>
        ${roadBar(pct, true)}
        <div class="run-score"><b>${RS.fmt(r.pts)}</b>${mult > 1 ? `<span class="combo">${ic('bolt', 11, true)} ×${mult}</span>` : `<small class="small-t muted">points</small>`}</div>
      </header>
      <div class="run-body">
        <article class="q-card ${!q.visual && RS.plain(q.q).length <= 30 ? 'bare' : ''}">
          <div class="q-meta">
            <img class="q-thumb" src="img/${t.img}.webp" alt="" decoding="async">
            <div style="flex:1;min-width:0"><span class="eyebrow" style="display:block">${t.stop}</span><span class="small-t muted">${q.bonus ? 'Second chance' : t.title}</span></div>
            <span class="chip num">${r.i + 1} of ${r.queue.length}</span>
            <button class="round small" data-act="read" aria-label="Read the question aloud">${ic('speaker', 18)}</button>
          </div>
          <h1 class="q-text">${h(q.q)}</h1>
          ${visual(q)}
        </article>
        <div class="dock">${dock(q)}</div>
      </div>
      ${sheetHTML()}
    </section>`;
  }
  function drawRun() {
    $('#app').innerHTML = viewRun();
    const primary = document.querySelector('[data-primary]');
    if (primary) primary.focus({ preventScroll: true });
  }
  function typeKey(k) {
    const r = ui.run;
    if (!r || r.sheet) return;
    if (k === 'del') r.typed = r.typed.slice(0, -1);
    else if (r.typed.length < 14) {
      if (k === ',' && r.typed.includes(',')) return;
      if (k === ' ' && (!r.typed || r.typed.includes(' '))) return;
      if (k === '/' && (!r.typed || r.typed.includes('/') || r.typed.endsWith(' '))) return;
      r.typed += k;
    }
    const v = $('#ans-val');
    if (v) v.textContent = prettyTyped(r.typed);
  }
  function checkTyped() {
    const r = ui.run;
    if (!r) return;
    const w = $('#ans-word');
    submit(w ? w.value : r.typed);
  }

  // ---------- results ----------
  function viewResult() {
    const x = ui.result;
    const title = x.stars === 3 ? '1st place' : x.stars === 2 ? '2nd place' : x.stars === 1 ? '3rd place' : 'Back to the gate';
    const again = `data-act="start" data-mode="${x.mode}" ${x.topicId ? `data-topic="${x.topicId}"` : ''}`;
    return `<div class="wrap" style="padding-bottom:32px;padding-left:max(16px,env(safe-area-inset-left,0px));max-width:720px">
      <section class="card result-head">
        <div class="result-photo">${photo(x.stars >= 2 ? 'finish' : 'stop-gate', x.stars >= 2 ? 'A rider crossing the finish line' : 'Riders launching off the start gate')}</div>
        <div class="eyebrow">${x.label}</div>
        <h1>${title}</h1>
        <div class="result-stars">${[1, 2, 3].map((i) => `<span class="${i <= x.stars ? 'on' : ''}" style="animation-delay:${i * 0.12}s">${ic('star', 40, true)}</span>`).join('')}</div>
      </section>
      <section class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${tile('target', 'Score', x.pct + '%', `<span class="chip num">${x.right} of ${x.total} right</span>`)}
        ${tile('star', 'Points won', '+' + RS.fmt(x.pts), `<span class="chip lime num">Includes +${x.bonus} bonus</span>`)}
        ${tile('bolt', 'Best in a row', x.bestCombo, `<span class="chip">${x.bestCombo >= 6 ? 'Full gas' : x.bestCombo >= 3 ? 'Nice combo' : 'Keep building'}</span>`)}
        ${tile('flame', 'Day streak', x.streak, `<span class="chip good">Ride again tomorrow</span>`)}
      </section>
      ${x.newBadges.length ? `<section class="card"><div class="h-sec" style="margin-bottom:8px">New badge${x.newBadges.length > 1 ? 's' : ''}</div><div class="badges">${x.newBadges.map((b) => `<div class="badge got"><b>${b.label}</b><small>${b.desc}</small></div>`).join('')}</div></section>` : ''}
      ${x.missed.length ? `<section class="card"><div class="h-sec" style="margin-bottom:8px">Look at these again</div><div class="log">${x.missed.map((m) => `<div class="log-item"><div>${h(m.q)}</div><div class="small-t" style="margin-top:2px"><b>Answer:</b> ${h(m.correct)}${m.given ? ` <span class="muted">(you said ${h(String(m.given))})</span>` : ''}</div><details><summary>Show the working</summary><ol>${m.steps.map((s) => `<li>${h(s)}</li>`).join('')}</ol></details></div>`).join('')}</div></section>` : ''}
      <button class="btn primary full" ${again}>Go again ${ic('arrow')}</button>
      <button class="btn full" data-act="home">Back to the pits</button>
    </div>`;
  }

  // ---------- voice ----------
  let recog = null;
  function stopVoice() {
    if (recog) {
      recog.onresult = recog.onend = recog.onerror = null;
      try {
        recog.abort();
      } catch (e) { /* already stopped */ }
      recog = null;
    }
    if (ui.run) ui.run.listening = false;
  }
  function showHeard(text) {
    if (ui.run) ui.run.heard = text;
    const el = $('#heard');
    if (el) el.textContent = text;
  }
  function markMic(on) {
    const m = $('#mic');
    if (!m) return;
    m.classList.toggle(m.classList.contains('btn') ? 'primary' : 'on', on);
    m.setAttribute('aria-pressed', String(on));
  }
  function applySpeech(alts) {
    const r = ui.run;
    if (!r || r.sheet) return;
    const q = r.q;
    if (q.kind === 'mc') {
      const idxs = alts.map((a) => RS.matchOption(a, q.options));
      const idx = idxs.includes(q.answer) ? q.answer : idxs.find((i) => i >= 0);
      if (idx === undefined || idx < 0) {
        showHeard(`I heard "${alts[0]}". Say A, B, C or D, or tap your answer.`);
        return;
      }
      const btn = $(`#opt-${idx}`);
      if (btn) btn.classList.add('heard');
      showHeard(`I heard "${alts[0]}".`);
      setTimeout(() => {
        if (ui.run && ui.run.q === q) submit(null, idx);
      }, 500);
      return;
    }
    if (q.kind === 'word') {
      const pickAlt = alts.find((a) => RS.check(q, a).ok) || alts[0];
      const w = $('#ans-word');
      if (w) w.value = pickAlt.toLowerCase();
      showHeard(`I heard "${pickAlt}". Tap Check if that's right.`);
      return;
    }
    const parsed = alts.map((a) => RS.spoken(a));
    const good = parsed.find((t) => RS.check(q, t).ok) || parsed.find((t) => RS.parseValue(t).values.length);
    if (!good) {
      showHeard(`I heard "${alts[0]}". Try saying just the number.`);
      return;
    }
    r.typed = good.replace(/\./g, ',').replace(/^(\d+),(\d{3})$/, '$1$2');
    const v = $('#ans-val');
    if (v) v.textContent = prettyTyped(r.typed);
    showHeard(`I heard "${alts[0]}". Tap Check if that's right.`);
  }
  function startListening() {
    const r = ui.run;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!r || !SR) return;
    if (r.listening) {
      stopVoice();
      markMic(false);
      return;
    }
    stopSpeaking();
    let last = null;
    let applied = false;
    try {
      recog = new SR();
      recog.lang = r.q.lang || 'en-ZA';
      recog.interimResults = true;
      recog.maxAlternatives = 5;
      recog.continuous = false;
      recog.onresult = (e) => {
        const res = e.results[e.results.length - 1];
        last = Array.from(res).map((a) => a.transcript.trim());
        showHeard(last[0]);
        if (res.isFinal && !applied) {
          applied = true;
          applySpeech(last);
        }
      };
      recog.onerror = (e) => {
        r.listening = false;
        markMic(false);
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          ui.voiceBlocked = true;
          toast('The microphone is blocked here. Type your answer instead.');
          drawRun();
        } else if (e.error === 'no-speech') showHeard("I didn't hear anything. Tap the mic and try again.");
        else if (e.error !== 'aborted') showHeard('Voice stopped working. Type your answer instead.');
      };
      recog.onend = () => {
        r.listening = false;
        markMic(false);
        if (last && !applied) {
          applied = true;
          applySpeech(last);
        }
      };
      recog.start();
      r.listening = true;
      markMic(true);
      showHeard('Listening…');
    } catch (e) {
      ui.voiceBlocked = true;
      toast('Voice does not work here. Type your answer instead.');
      drawRun();
    }
  }

  // ---------- reading aloud ----------
  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }
  function readAloud() {
    const r = ui.run;
    if (!r || !window.speechSynthesis) return;
    stopSpeaking();
    let text = RS.speakable(r.q.q);
    if (r.q.visual && r.q.visual.type === 'flow') text += '. ' + r.q.visual.items.map(RS.speakable).join(', then ');
    if (r.q.kind === 'mc') text += '. ' + r.q.options.map((o, i) => `${'ABCD'[i]}: ${RS.speakable(o)}`).join('. ');
    const u = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const want = r.q.lang || 'en-ZA';
    const v = voices.find((x) => x.lang.replace('_', '-') === want) || voices.find((x) => x.lang.startsWith(want.slice(0, 2))) || voices.find((x) => x.lang === 'en-GB') || voices.find((x) => /^en/.test(x.lang));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'en-ZA';
    u.rate = 0.97;
    window.speechSynthesis.speak(u);
  }

  // ---------- sound and confetti ----------
  let ac = null;
  function audio() {
    if (ac || !state.sound) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* no sound on this device */ }
  }
  function tone(freq, at, dur, type = 'sine', vol = 0.12) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime + at);
    g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + at + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + at);
    o.stop(ac.currentTime + at + dur + 0.02);
  }
  function sfx(kind) {
    if (!state.sound) return;
    audio();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    if (kind === 'right') [660, 880].forEach((f, i) => tone(f, i * 0.09, 0.16));
    if (kind === 'combo') [660, 880, 1175].forEach((f, i) => tone(f, i * 0.07, 0.16, 'triangle'));
    if (kind === 'wrong') tone(196, 0, 0.22, 'triangle', 0.1);
    if (kind === 'tap') tone(520, 0, 0.06, 'sine', 0.06);
    if (kind === 'fanfare') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.26, 'triangle'));
  }
  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#fx');
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const paint = PAINTS[P().paint].hex;
    const colours = [paint, '#C8F031', '#111318', '#FFC83D', '#FFFFFF'];
    const bits = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + RS.ri(-60, 60), y: innerHeight * 0.32, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 11 - 3, s: RS.ri(5, 10), c: RS.pick(colours), r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 }));
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const alive = now - start < 1900;
      for (const b of bits) {
        b.vy += 0.26;
        b.x += b.vx;
        b.y += b.vy;
        b.r += b.vr;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.r);
        ctx.fillStyle = b.c;
        ctx.fillRect(-b.s / 2, -b.s / 3, b.s, (b.s * 2) / 3);
        ctx.restore();
      }
      if (alive) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(start);
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      t.hidden = true;
    }, 2800);
  }

  // ---------- main render ----------
  function render() {
    applyAccent();
    const app = $('#app');
    if (!ui.who) app.innerHTML = viewPick();
    else if (ui.run) drawRun();
    else if (ui.result) app.innerHTML = viewResult();
    else app.innerHTML = { home: viewHome, route: viewRoute, garage: viewGarage, progress: viewProgress }[ui.tab]();
  }

  // ---------- race number ----------
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'plate-input' || !ui.who) return;
    const digits = e.target.value.replace(/\D/g, '').slice(0, 3);
    e.target.value = digits;
    if (!digits) return;
    P().plate = digits;
    save();
    document.querySelectorAll('.top .plate').forEach((el) => {
      el.textContent = digits;
    });
  });

  // ---------- taps ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const id = el.dataset.id;
    const p = ui.who ? P() : null;
    switch (act) {
      case 'who':
        ui.who = id;
        ui.subject = openSubject(RS.packs[id]);
        ui.tab = 'home';
        audio();
        render();
        window.scrollTo(0, 0);
        break;
      case 'subject':
        ui.subject = id;
        ui.confirmReset = false;
        render();
        break;
      case 'switch':
        ui.who = null;
        ui.result = null;
        ui.confirmReset = false;
        render();
        window.scrollTo(0, 0);
        break;
      case 'tab':
        ui.tab = id;
        ui.confirmReset = false;
        render();
        window.scrollTo(0, 0);
        break;
      case 'home':
        ui.result = null;
        ui.tab = 'home';
        render();
        window.scrollTo(0, 0);
        break;
      case 'start':
        startRun(el.dataset.mode, el.dataset.topic);
        break;
      case 'opt':
        submit(null, +el.dataset.i);
        break;
      case 'key':
        sfx('tap');
        typeKey(el.dataset.k);
        break;
      case 'check':
        checkTyped();
        break;
      case 'skip': {
        const r = ui.run;
        settle(r.q, false, true, '');
        r.combo = 0;
        r.i++;
        nextQuestion();
        break;
      }
      case 'next':
        ui.run.i++;
        nextQuestion();
        break;
      case 'retry':
        ui.run.typed = '';
        ui.run.heard = '';
        ui.run.sheet = null;
        drawRun();
        break;
      case 'mic':
        startListening();
        break;
      case 'read':
        readAloud();
        break;
      case 'quit':
        stopVoice();
        ui.run.sheet = { type: 'quit', prev: ui.run.sheet };
        drawRun();
        break;
      case 'unquit': {
        const prev = ui.run.sheet.prev;
        ui.run.sheet = prev && prev.type !== 'quit' ? prev : null;
        drawRun();
        break;
      }
      case 'quit-yes':
        stopVoice();
        stopSpeaking();
        save();
        ui.run = null;
        render();
        window.scrollTo(0, 0);
        break;
      case 'bike': {
        const r = BIKES[id];
        if (p.ownedB.includes(id)) p.bike = id;
        else if (p.points >= r.cost) {
          p.points -= r.cost;
          p.ownedB.push(id);
          p.bike = id;
          sfx('combo');
        } else {
          toast(`You need ${RS.fmt(r.cost - p.points)} more points for the ${r.label}.`);
          break;
        }
        save();
        render();
        break;
      }
      case 'paint': {
        const c = PAINTS[id];
        if (p.ownedP.includes(id)) p.paint = id;
        else if (p.points >= c.cost) {
          p.points -= c.cost;
          p.ownedP.push(id);
          p.paint = id;
          sfx('combo');
        } else {
          toast(`You need ${RS.fmt(c.cost - p.points)} more points for ${c.label}.`);
          break;
        }
        save();
        render();
        break;
      }
      case 'toggle':
        state[id] = !state[id];
        save();
        render();
        break;
      case 'bar':
        ui.chartPick = id;
        render();
        break;
      case 'reset':
        ui.confirmReset = true;
        render();
        break;
      case 'reset-no':
        ui.confirmReset = false;
        render();
        break;
      case 'reset-yes':
        state.players[ui.who] = blankPlayer(PK());
        ui.confirmReset = false;
        save();
        render();
        break;
      default:
    }
  });

  // ---------- keyboard for laptops ----------
  document.addEventListener('keydown', (e) => {
    const r = ui.run;
    if (!r || e.ctrlKey || e.metaKey || e.altKey) return;
    if (r.sheet) {
      if (e.key === 'Enter') {
        const b = document.querySelector('[data-primary]');
        if (b) {
          e.preventDefault();
          b.click();
        }
      }
      return;
    }
    if (e.target.tagName === 'INPUT') {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkTyped();
      }
      return;
    }
    if (r.q.kind === 'mc') {
      const i = 'abcd'.indexOf(e.key.toLowerCase());
      if (i >= 0 && i < r.q.options.length) submit(null, i);
      return;
    }
    if (r.q.kind === 'word') return;
    if (/^\d$/.test(e.key)) typeKey(e.key);
    else if (e.key === ',' || e.key === '.') typeKey(',');
    else if (e.key === '/' && r.q.kind === 'fraction') {
      e.preventDefault();
      typeKey('/');
    } else if (e.key === ' ' && r.q.kind === 'fraction') {
      e.preventDefault();
      typeKey(' ');
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      typeKey('del');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      checkTyped();
    }
  });

  // Lets test scripts see the game's state. Nothing in the game uses these.
  RS._ui = ui;
  RS._render = render;
  RS._applySpeech = applySpeech;

  render();
})();

</script>
</body></html>
